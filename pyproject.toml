[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "great-red-spot-detector"
version = "7.0.2"
description = "Jupiter Great Red Spot Detector — measure GRS System III longitude & latitude from stacked Jupiter images with SPICE geometry and calibrated error bars"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary — see LICENSE" }
authors = [{ name = "Jupiter Great Red Spot Detector Authors" }]
keywords = [
  "astronomy",
  "jupiter",
  "great-red-spot",
  "grs",
  "detector",
  "great-red-spot-detector",
  "metrology",
  "spice",
  "planetary-imaging",
  "winjupos",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Programming Language :: Python :: 3",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "numpy>=1.22",
  "scipy>=1.9",
  "Pillow>=9.0",
  "astropy>=5.0",
  "certifi>=2023.0.0",
  "spiceypy>=6.0",
  "flask>=2.3",
]

[project.optional-dependencies]
desktop = []
dev = ["pytest>=7.0"]
moons = ["pyephem>=4.1"]  # Galilean transit fallback backend (SPICE jup365 preferred)

[project.scripts]
grs-observatory = "cli:main"

[tool.setuptools]
package-dir = {"" = "app"}
py-modules = [
  "cli",
  "product_core",
  "desktop_pipeline",
  "precision_engine",
  "ephemeris_pro",
  "grs_ephemeris_truth",
  "spice_auto",
  "synthetic_hq",
  "batch_prove",
  "research_grade",
  "vlbi_metrology",
  "verbose_log",
  "planet_models",
  "planetary_stacker",
  "planetary_derotator",
  "flow_warp",
  "frame_quality",
  # v6.8 "Observatory Pro"
  "ser_io",
  "ap_stacker",
  "sharpen_lab",
  "transits",
  "grs_ellipse",
  "animation",
  "jupos_io",
  "observatory_pipeline",
  "video_synth",
  "image_warp",
  # v6.9 "Analysis Pro"
  "rgb_combine",
  "wind_analysis",
  "grs_drift",
  "stack_report",
  "filter_wheel",
  "session_planner",
  "limb_darkening",
  # v7.0 "Velocity Pro"
  "cspeed",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["app"]
markers = [
  "slow: end-to-end runs that render and measure synthetic frames (minutes)",
]
